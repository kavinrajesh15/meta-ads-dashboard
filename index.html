<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar Time Ltd - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body, html {
  height: 100%;
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.hero {
  min-height: 100vh;
  background-color: #0a0a0a;
  background-image: linear-gradient(rgba(0,0,0,0.40), rgba(0,0,0,0.50)), url("spn.jpg");
  background-position: center center;
  background-repeat: no-repeat;
  background-size: cover;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.login-card {
  background: rgba(12, 16, 24, 0.78);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 18px;
  padding: 32px 28px;
  box-shadow: 0 25px 60px rgba(0,0,0,0.6);
  width: 100%;
  max-width: 420px;
  color: #f1f5f9;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 26px;
}
.brand img {
  height: 44px;
  width: auto;
  border-radius: 8px;
  background: #fff;
  padding: 3px;
}
.brand-text .stl {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .4px;
  color: #94a3b8;
  text-transform: uppercase;
}
.brand-text h1 {
  font-size: 17px;
  font-weight: 800;
  margin: 2px 0 0;
  line-height: 1.25;
}
label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: #cbd5e1;
  margin-bottom: 6px;
}
.form-group { margin-bottom: 15px; }
input[type="email"],
input[type="password"],
input[type="text"] {
  width: 100%;
  background: rgba(255,255,255,0.94);
  border: none;
  border-radius: 8px;
  padding: 11px 14px;
  color: #0f172a;
  font-size: 14px;
  font-family: inherit;
  outline: none;
}
input:focus {
  box-shadow: 0 0 0 3px rgba(6,104,225,0.35);
}
.pwd-wrap { position: relative; }
.pwd-wrap input { padding-right: 44px; }
.toggle-pwd {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: #64748b;
  cursor: pointer;
  font-size: 16px;
  padding: 4px;
}
.remember {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
  font-size: 13px;
  color: #cbd5e1;
}
.remember input { width: 16px; height: 16px; accent-color: #0668E1; }
.captcha-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
#captchaCanvas {
  background: #f1f5f9;
  border-radius: 6px;
}
.refresh-btn {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 6px;
  color: #e2e8f0;
  width: 40px;
  height: 40px;
  cursor: pointer;
  font-size: 16px;
}
.refresh-btn:hover { background: rgba(255,255,255,0.25); }
.submit-btn {
  width: 100%;
  margin-top: 6px;
  background: linear-gradient(135deg, #0668E1 0%, #4B9BFF 100%);
  border: none;
  border-radius: 8px;
  padding: 12px;
  color: #fff;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  transition: .15s;
}
.submit-btn:hover {
  filter: brightness(1.08);
  box-shadow: 0 4px 20px rgba(6,104,225,0.4);
}
.error-msg {
  background: rgba(239,68,68,0.18);
  border: 1px solid rgba(239,68,68,0.4);
  color: #fecaca;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
}
.footer {
  text-align: center;
  margin-top: 18px;
  font-size: 11px;
  color: rgba(255,255,255,0.45);
}
</style>
</head>
<body>
<div class="hero">
  <div class="login-card">
    <div class="brand">
      <img src="solarlogo.png" alt="Solar Time Ltd" onerror="this.style.display='none'">
      <div class="brand-text">
        <div class="stl">Solar Time Ltd</div>
        <h1>STL Business Intelligence</h1>
      </div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Username / Email</label>
        <input type="email" id="email" required placeholder="sales@solartimeltd.com" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="pwd-wrap">
          <input type="password" id="password" required placeholder="Enter password" autocomplete="current-password">
          <button type="button" class="toggle-pwd" id="togglePwd" title="Show/Hide">👁️</button>
        </div>
      </div>

      <div class="remember">
        <input type="checkbox" id="rememberMe">
        <label for="rememberMe" style="margin:0;cursor:pointer">Remember me</label>
      </div>

      <div class="form-group">
        <label>CAPTCHA</label>
        <div class="captcha-row">
          <canvas id="captchaCanvas" width="140" height="40"></canvas>
          <button type="button" class="refresh-btn" id="refreshBtn" title="Refresh">🔄</button>
        </div>
        <input type="text" id="captchaInput" required placeholder="Type the text above" style="margin-top:8px" autocomplete="off">
      </div>

      <button type="submit" class="submit-btn">Sign In</button>
    </form>

    <div class="footer">© 2026 Solar Time Ltd · Internal Use Only</div>
  </div>
</div>

<script>
const ALLOWED_EMAIL = "sales@solartimeltd.com";
const ALLOWED_PASSWORD = "Solar123$";

const canvas = document.getElementById("captchaCanvas");
const ctx = canvas.getContext("2d");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const captchaInput = document.getElementById("captchaInput");
const errorMsg = document.getElementById("errorMsg");
const form = document.getElementById("loginForm");
let currentCaptcha = "";

if (localStorage.getItem("stl_saved_email") && localStorage.getItem("stl_saved_pass")) {
  emailInput.value = localStorage.getItem("stl_saved_email");
  passwordInput.value = localStorage.getItem("stl_saved_pass");
  document.getElementById("rememberMe").checked = true;
}

if (localStorage.getItem("stl_meta_logged_in") === "true") {
  window.location.href = "meta-dashboard.html";
}

document.getElementById("togglePwd").addEventListener("click", function() {
  const t = passwordInput.getAttribute("type");
  if (t === "password") {
    passwordInput.setAttribute("type", "text");
    this.textContent = "🙈";
  } else {
    passwordInput.setAttribute("type", "password");
    this.textContent = "👁️";
  }
});

function generateCaptcha() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
  let code = "";
  for (let i = 0; i < 5; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
  return code;
}

function drawCaptcha() {
  currentCaptcha = generateCaptcha();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#f1f5f9";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (let i = 0; i < 4; i++) {
    ctx.strokeStyle = `hsl(${Math.random()*360},50%,40%)`;
    ctx.beginPath();
    ctx.moveTo(Math.random()*canvas.width, Math.random()*canvas.height);
    ctx.lineTo(Math.random()*canvas.width, Math.random()*canvas.height);
    ctx.stroke();
  }
  ctx.font = "bold 22px Inter, Arial";
  for (let i = 0; i < currentCaptcha.length; i++) {
    ctx.fillStyle = `hsl(${Math.random()*360},65%,35%)`;
    ctx.save();
    const x = 14 + i * 24;
    const y = 28 + (Math.random()*6 - 3);
    ctx.translate(x, y);
    ctx.rotate((Math.random() - 0.5) * 0.35);
    ctx.fillText(currentCaptcha[i], 0, 0);
    ctx.restore();
  }
}

document.getElementById("refreshBtn").addEventListener("click", drawCaptcha);
drawCaptcha();

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.style.display = "block";
}

form.addEventListener("submit", function(e) {
  e.preventDefault();
  errorMsg.style.display = "none";
  const email = emailInput.value.trim().toLowerCase();
  const pass = passwordInput.value;
  if (email !== ALLOWED_EMAIL) {
    showError("Access denied. Invalid username.");
    return;
  }
  if (pass !== ALLOWED_PASSWORD) {
    showError("Incorrect password. Access denied.");
    return;
  }
  if (captchaInput.value.trim() !== currentCaptcha) {
    showError("Incorrect CAPTCHA. Please try again.");
    captchaInput.value = "";
    drawCaptcha();
    return;
  }
  localStorage.setItem("stl_meta_logged_in", "true");
  if (document.getElementById("rememberMe").checked) {
    localStorage.setItem("stl_saved_email", emailInput.value.trim());
    localStorage.setItem("stl_saved_pass", pass);
  } else {
    localStorage.removeItem("stl_saved_email");
    localStorage.removeItem("stl_saved_pass");
  }
  window.location.href = "meta-dashboard.html";
});
</script>
</body>
</html>
