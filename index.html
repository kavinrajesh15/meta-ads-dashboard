<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta Ads Manager</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#05070d;--surface:#0a0e16;--card:#0e1420;--card2:#131b2a;
  --border:#1c2536;--text:#eef2f7;--muted:#8b95a8;--dim:#5c6b82;
  --blue:#1877f2;--blue2:#4da3ff;--cyan:#22d3ee;--green:#22c55e;
  --amber:#f59e0b;--purple:#a78bfa;--pink:#ec4899;--red:#ef4444;
  --grad:linear-gradient(135deg,#1877f2 0%,#8b5cf6 50%,#ec4899 100%);
  --radius:16px;--shadow:0 12px 40px rgba(0,0,0,.42);
}
[data-theme="light"]{
  --bg:#eef1f6;--surface:#ffffff;--card:#ffffff;--card2:#f4f6fb;
  --border:#d7dee9;--text:#0f172a;--muted:#64748b;--dim:#94a3b8;
  --shadow:0 8px 28px rgba(15,23,42,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.nav{height:62px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:50}
.ib{width:40px;height:40px;border-radius:11px;border:1px solid var(--border);background:var(--card2);color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:.15s}
.ib:hover{color:var(--text);border-color:var(--blue)}
.brand{display:flex;align-items:center;gap:11px;flex:1}
.logo{width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px}
.brand h1{font-size:15px;font-weight:700;letter-spacing:-.2px}
.brand p{font-size:11px;color:var(--dim)}
.nav-r{display:flex;align-items:center;gap:8px}
.live{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:var(--green);font-size:11px;font-weight:700}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 8px transparent}}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.22s;z-index:80}
.bd.show{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;left:0;bottom:0;width:300px;background:var(--surface);border-right:1px solid var(--border);transform:translateX(-105%);transition:.26s cubic-bezier(.4,0,.2,1);z-index:90;padding:16px 12px;overflow:auto}
.dr.show{transform:translateX(0)}
.dr-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:4px 6px 12px;border-bottom:1px solid var(--border)}
.dr-h h3{font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.55px}
.bb{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:var(--muted);padding:12px 13px;border-radius:11px;cursor:pointer;font-size:13.5px;font-weight:500;margin-bottom:3px;transition:.15s}
.bb:hover{background:var(--card2);color:var(--text)}
.bb.on{background:rgba(24,119,242,.12);border-color:rgba(24,119,242,.35);color:var(--blue2)}
.wrap{max-width:1400px;margin:0 auto;padding:22px 24px 48px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.head h2{font-size:24px;font-weight:750;letter-spacing:-.4px}
.head .sub{font-size:12.5px;color:var(--dim);margin-top:4px}
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 10px}
.filters label{font-size:11px;color:var(--dim);font-weight:600}
.filters input{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:7px 9px;font-size:12.5px;outline:0}
.filters input:focus{border-color:var(--blue)}
.btn{border:0;background:var(--grad);color:#fff;font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:9px;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 14px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.kpi:before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--grad)}
.kpi .l{font-size:10.5px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.kpi .s{font-size:11px;color:var(--dim);margin-top:5px}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin:16px 0 18px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.panel h3{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:12px}
.ch{height:280px;position:relative}
.tc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.th{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap}
.th h3{font-size:13.5px;font-weight:700}
.search{width:240px;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:8px 11px;font-size:12.5px;outline:0}
.search:focus{border-color:var(--blue)}
.scroll{max-height:560px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{position:sticky;top:0;z-index:1;background:var(--card2);color:var(--dim);text-align:left;font-size:10px;letter-spacing:.35px;text-transform:uppercase;padding:10px 11px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 11px;border-bottom:1px solid var(--border);color:var(--muted);white-space:nowrap}
tr:hover td{background:rgba(24,119,242,.04)}
.hi{color:var(--green);font-weight:800}.mid{color:var(--amber);font-weight:800}.lo{color:var(--red);font-weight:800}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700}
.on{background:rgba(34,197,94,.14);color:var(--green)}.off{background:rgba(239,68,68,.12);color:var(--red)}
.center{min-height:70vh;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px}
.sp{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.err{max-width:520px;margin:40px auto;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.28);color:#ff9b9b;border-radius:14px;padding:22px;line-height:1.55}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="bd" id="bd" onclick="closeMenu()"></div>
<aside class="dr" id="dr">
  <div class="dr-h"><h3>Brands</h3><button class="ib" style="width:32px;height:32px" onclick="closeMenu()">✕</button></div>
  <div id="brands"></div>
</aside>

<header class="nav">
  <button class="ib" onclick="openMenu()" title="Brands">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="brand">
    <div class="logo">∞</div>
    <div><h1>Meta Ads Manager</h1><p>Performance Dashboard</p></div>
  </div>
  <div class="nav-r">
    <div class="live"><span class="dot"></span>LIVE</div>
    <button class="ib" onclick="boot()" title="Refresh data">↻</button>
    <button class="ib" id="themeBtn" onclick="toggleTheme()" title="Theme">☾</button>
  </div>
</header>

<div id="app"><div class="center"><div><div class="sp"></div>Loading live Meta data...</div></div></div>

<script>
const CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vSiL5WkAU2ik5pbR5OdtULPGsNbO7b2wrFV4MMebkkTrS75YgTNK92UHDSX8iwsD1ExZsR7khftXnZw/pub?output=csv";
const NAME={"AVI-8 International":"AVI-8","Earnshaw International":"Thomas Earnshaw","Spinnaker International":"Spinnaker","Cadola Watches":"Cadola","Duxot Watches":"Duxot","RGMT Watches":"RGMT","Nubeo":"Nubeo"};
const dn=b=>NAME[b]||b;

let rows=[],brand="ALL",from="",to="",spendChart,roasChart;

function openMenu(){document.getElementById("dr").classList.add("show");document.getElementById("bd").classList.add("show")}
function closeMenu(){document.getElementById("dr").classList.remove("show");document.getElementById("bd").classList.remove("show")}
function toggleTheme(){const h=document.documentElement,n=h.getAttribute("data-theme")==="dark"?"light":"dark";h.setAttribute("data-theme",n);document.getElementById("themeBtn").textContent=n==="dark"?"☾":"☀";renderCharts()}

function split(line){const r=[];let c="",q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){q=!q;continue}if(ch===','&&!q){r.push(c);c="";continue}c+=ch}r.push(c);return r}
function parse(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return[];
  const h=split(lines[0]);const out=[];
  for(let i=1;i<lines.length;i++){
    const v=split(lines[i]);if(v.length<6)continue;
    const o={};h.forEach((k,idx)=>o[k]=v[idx]??"");
    if(!o.Brand||o.Brand==="Brand")continue;
    if(o["Amount spent (HKD)"]==="Amount spent (HKD)")continue;
    out.push(o);
  }
  return out;
}
function n(v){if(v==null||v===""||v==="-")return 0;const x=parseFloat(String(v).replace(/,/g,""));return isNaN(x)?0:x}
function fmt(v){if(v>=1e6)return(v/1e6).toFixed(2)+"M";if(v>=1e3)return(v/1e3).toFixed(1)+"K";return Math.round(v).toLocaleString()}
function hkd(v){return "HK$ "+fmt(v)}

async function boot(){
  const app=document.getElementById("app");
  app.innerHTML=`<div class="center"><div><div class="sp"></div>Loading live Meta data...</div></div>`;
  try{
    const res=await fetch(CSV+"&t="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    rows=parse(await res.text());
    if(!rows.length) throw new Error("No data rows found");
    const starts=[...new Set(rows.map(r=>r["Reporting starts"]).filter(Boolean))].sort();
    const ends=[...new Set(rows.map(r=>r["Reporting ends"]).filter(Boolean))].sort();
    const dates=starts;
    from=starts[0]; to=ends[ends.length-1] || starts[starts.length-1];
    build(starts, ends); setBrand("ALL");
  }catch(e){
    app.innerHTML=`<div class="err"><b>Could not load live data</b><br><br>${e.message}<br><br>Check sheet is published as CSV and click Refresh.</div>`;
  }
}

function build(starts, ends){
  const dates=starts;
  const brands=[...new Set(rows.map(r=>r.Brand).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  document.getElementById("brands").innerHTML=
    `<button class="bb on" data-b="ALL" onclick="setBrand('ALL')">All Brands</button>`+
    brands.map(b=>`<button class="bb" data-b="${b}" onclick="setBrand('${b}')">${dn(b)}</button>`).join("");

  document.getElementById("app").innerHTML=`
  <div class="wrap">
    <div class="head">
      <div>
        <h2 id="title">All Brands</h2>
        <div class="sub" id="sub">${rows.length.toLocaleString()} ad rows · Live Google Sheet · ${from} → ${to}</div>
      </div>
      <div class="filters">
        <label>From</label><input type="date" id="from" value="${from}" min="${starts[0]}" max="${starts[starts.length-1]}">
        <label>To</label><input type="date" id="to" value="${to}" min="${starts[0]}" max="${ends[ends.length-1]||starts[starts.length-1]}">
        <button class="btn" onclick="applyDates()">Apply</button>
      </div>
    </div>
    <div class="kpis" id="kpi1"></div>
    <div class="kpis" id="kpi2"></div>
    <div class="grid2">
      <div class="panel"><h3>Spend by Brand (HK$)</h3><div class="ch"><canvas id="cSpend"></canvas></div></div>
      <div class="panel"><h3>ROAS by Brand</h3><div class="ch"><canvas id="cRoas"></canvas></div></div>
    </div>
    <div class="tc">
      <div class="th">
        <h3>Campaign Performance</h3>
        <input class="search" id="q" placeholder="Search campaign / brand..." oninput="drawTable()">
      </div>
      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th>Campaign</th><th>Brand</th><th>Spend</th><th>Impr.</th><th>Clicks</th>
              <th>CTR</th><th>CPC</th><th>LPV</th><th>ATC</th><th>Purchases</th>
              <th>Revenue</th><th>ROAS</th><th>CPA</th><th>Hook%</th><th>Hold%</th><th>Status</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>`;
}

function applyDates(){from=document.getElementById("from").value;to=document.getElementById("to").value;render()}
function setBrand(b){
  brand=b;closeMenu();
  document.querySelectorAll(".bb").forEach(el=>el.classList.toggle("on",el.dataset.b===b));
  const t=document.getElementById("title"); if(t) t.textContent=b==="ALL"?"All Brands":dn(b);
  render();
}
function filtered(){
  return rows.filter(r=>{
    if(brand!=="ALL"&&r.Brand!==brand) return false;
    const s=r["Reporting starts"]||"";
    const e=r["Reporting ends"]||s;
    if(from&&s<from) return false;
    if(to&&e>to) return false;
    return true;
  });
}
function agg(list){
  const a={spend:0,imps:0,reach:0,clicks:0,lpv:0,purch:0,atc:0,rev:0,ads:0,active:0,hook:0,hold:0,hookN:0,holdN:0};
  const camps={}, brands={};
  list.forEach(r=>{
    const spend=n(r["Amount spent (HKD)"]),imps=n(r.Impressions),reach=n(r.Reach);
    const clicks=n(r["LINK CLICKS"]),lpv=n(r["Landing page views"]),purch=n(r.Purchases);
    const atc=n(r["Add to cart"]),rev=n(r["Purchase value"]),st=r["Ad delivery"]||"";
    const hook=n(r["Hook Rate (%)"]),hold=n(r["Hold Rate (%)"]);
    const cname=r["Campaign name"]||"Unknown", b=r.Brand||"Unknown";
    a.spend+=spend;a.imps+=imps;a.reach+=reach;a.clicks+=clicks;a.lpv+=lpv;a.purch+=purch;a.atc+=atc;a.rev+=rev;a.ads++;
    if(st==="ACTIVE") a.active++;
    if(hook>0){a.hook+=hook;a.hookN++} if(hold>0){a.hold+=hold;a.holdN++}
    if(!brands[b]) brands[b]={spend:0,rev:0};
    brands[b].spend+=spend; brands[b].rev+=rev;
    if(!camps[cname]) camps[cname]={brand:b,spend:0,imps:0,clicks:0,lpv:0,atc:0,purch:0,rev:0,hook:0,hold:0,hookN:0,holdN:0,status:new Set()};
    const c=camps[cname];
    c.spend+=spend;c.imps+=imps;c.clicks+=clicks;c.lpv+=lpv;c.atc+=atc;c.purch+=purch;c.rev+=rev;
    if(hook>0){c.hook+=hook;c.hookN++} if(hold>0){c.hold+=hold;c.holdN++}
    if(st) c.status.add(st);
  });
  a.roas=a.spend?a.rev/a.spend:0; a.cpc=a.clicks?a.spend/a.clicks:0;
  a.ctr=a.imps?a.clicks/a.imps*100:0; a.cpa=a.purch?a.spend/a.purch:0;
  a.hookAvg=a.hookN?a.hook/a.hookN:0; a.holdAvg=a.holdN?a.hold/a.holdN:0;
  return {a,camps,brands};
}
function render(){
  const list=filtered(); const {a,camps,brands}=agg(list);
  document.getElementById("kpi1").innerHTML=`
    <div class="kpi"><div class="l">Total Spend</div><div class="v" style="color:var(--blue2)">${hkd(a.spend)}</div><div class="s">HKD</div></div>
    <div class="kpi"><div class="l">Revenue</div><div class="v" style="color:var(--green)">${hkd(a.rev)}</div><div class="s">Purchase value</div></div>
    <div class="kpi"><div class="l">ROAS</div><div class="v" style="color:var(--cyan)">${a.roas.toFixed(2)}x</div><div class="s">Return on ad spend</div></div>
    <div class="kpi"><div class="l">Purchases</div><div class="v" style="color:var(--amber)">${fmt(a.purch)}</div><div class="s">Conversions</div></div>
    <div class="kpi"><div class="l">CPA</div><div class="v" style="color:var(--purple)">HK$ ${a.cpa.toFixed(0)}</div><div class="s">Cost per purchase</div></div>`;
  document.getElementById("kpi2").innerHTML=`
    <div class="kpi"><div class="l">Impressions</div><div class="v" style="color:var(--blue2)">${fmt(a.imps)}</div><div class="s">Total views</div></div>
    <div class="kpi"><div class="l">Reach</div><div class="v" style="color:var(--cyan)">${fmt(a.reach)}</div><div class="s">Unique users</div></div>
    <div class="kpi"><div class="l">Link Clicks</div><div class="v" style="color:var(--green)">${fmt(a.clicks)}</div><div class="s">CTR ${a.ctr.toFixed(2)}%</div></div>
    <div class="kpi"><div class="l">Hook Rate</div><div class="v" style="color:var(--amber)">${a.hookAvg.toFixed(1)}%</div><div class="s">Avg hook</div></div>
    <div class="kpi"><div class="l">Active Ads</div><div class="v" style="color:var(--pink)">${a.active}</div><div class="s">of ${a.ads} total</div></div>`;
  window.__camps=Object.entries(camps).map(([name,c])=>({
    name,brand:c.brand,spend:c.spend,imps:c.imps,clicks:c.clicks,lpv:c.lpv,atc:c.atc,purch:c.purch,rev:c.rev,
    roas:c.spend?c.rev/c.spend:0,cpc:c.clicks?c.spend/c.clicks:0,ctr:c.imps?c.clicks/c.imps*100:0,cpa:c.purch?c.spend/c.purch:0,
    hook:c.hookN?c.hook/c.hookN:0,hold:c.holdN?c.hold/c.holdN:0,status:[...c.status]
  })).sort((x,y)=>y.spend-x.spend);
  window.__brands=brands; renderCharts(); drawTable();
}
function renderCharts(){
  const dark=document.documentElement.getAttribute("data-theme")==="dark";
  const tick=dark?"#8b95a8":"#64748b", grid=dark?"rgba(139,149,168,.08)":"rgba(100,116,139,.12)";
  const b=window.__brands||{};
  const names=Object.keys(b).sort((a,c)=>b[c].spend-b[a].spend);
  const labels=names.map(dn), spends=names.map(x=>b[x].spend), roas=names.map(x=>b[x].spend?b[x].rev/b[x].spend:0);
  if(spendChart) spendChart.destroy(); if(roasChart) roasChart.destroy();
  const cs=document.getElementById("cSpend"), cr=document.getElementById("cRoas"); if(!cs||!cr) return;
  spendChart=new Chart(cs,{type:"bar",data:{labels,datasets:[{data:spends,backgroundColor:"rgba(24,119,242,.8)",borderColor:"#1877f2",borderWidth:1,borderRadius:6}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{ticks:{color:tick,font:{size:11}},grid:{display:false}},y:{ticks:{color:tick,font:{size:11},callback:v=>fmt(v)},grid:{color:grid}}}}});
  roasChart=new Chart(cr,{type:"bar",data:{labels,datasets:[{data:roas,backgroundColor:roas.map(v=>v>=2.5?"rgba(34,197,94,.8)":v>=2?"rgba(245,158,11,.8)":"rgba(239,68,68,.72)"),borderRadius:6}]},
    options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{ticks:{color:tick,font:{size:11}},grid:{color:grid}},y:{ticks:{color:tick,font:{size:11}},grid:{display:false}}}}});
}
function drawTable(){
  const q=(document.getElementById("q")?.value||"").toLowerCase();
  let list=window.__camps||[];
  if(q) list=list.filter(c=>c.name.toLowerCase().includes(q)||dn(c.brand).toLowerCase().includes(q));
  const tb=document.getElementById("tbody"); if(!tb) return;
  if(!list.length){tb.innerHTML=`<tr><td colspan="16" style="text-align:center;padding:40px;color:var(--dim)">No campaigns</td></tr>`;return}
  tb.innerHTML=list.slice(0,150).map(c=>{
    const cls=c.roas>=2.5?"hi":c.roas>=2?"mid":"lo";
    const active=(c.status||[]).includes("ACTIVE");
    return `<tr>
      <td style="color:var(--text);font-weight:600;max-width:240px;overflow:hidden;text-overflow:ellipsis" title="${c.name}">${c.name}</td>
      <td>${dn(c.brand)}</td>
      <td>${hkd(c.spend)}</td>
      <td>${fmt(c.imps)}</td>
      <td>${fmt(c.clicks)}</td>
      <td>${c.ctr.toFixed(2)}%</td>
      <td>HK$ ${c.cpc.toFixed(2)}</td>
      <td>${fmt(c.lpv)}</td>
      <td>${fmt(c.atc)}</td>
      <td>${c.purch}</td>
      <td>${hkd(c.rev)}</td>
      <td class="${cls}">${c.roas.toFixed(2)}x</td>
      <td>HK$ ${c.cpa.toFixed(0)}</td>
      <td>${c.hook.toFixed(1)}%</td>
      <td>${c.hold.toFixed(1)}%</td>
      <td><span class="pill ${active?"on":"off"}">${active?"ACTIVE":"PAUSED"}</span></td>
    </tr>`;
  }).join("");
}
boot();
</script>
</body>
</html>
