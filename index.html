<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta Ads Manager – LIVE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#07090f;--surface:#0c1018;--card:#111827;--card2:#161f2e;
  --border:#1c2838;--border2:#2a3a50;--text:#f1f5f9;--muted:#94a3b8;--dim:#64748b;
  --meta:#0668E1;--meta2:#4B9BFF;--cyan:#22d3ee;--green:#22c55e;--amber:#f59e0b;
  --purple:#a78bfa;--pink:#ec4899;--red:#ef4444;
  --grad:linear-gradient(135deg,#0668E1 0%,#4B9BFF 45%,#8b5cf6 100%);
  --radius:14px;--shadow:0 8px 32px rgba(0,0,0,.45);
}
[data-theme="light"]{
  --bg:#f0f4f8;--surface:#fff;--card:#fff;--card2:#f8fafc;
  --border:#e2e8f0;--border2:#cbd5e1;--text:#0f172a;--muted:#475569;--dim:#94a3b8;
  --shadow:0 8px 28px rgba(15,23,42,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.nav{height:58px;background:rgba(12,16,24,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:12px;position:sticky;top:0;z-index:50}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:.15s;font-size:15px}
.ib:hover{color:var(--text);border-color:var(--meta)}
.brand{display:flex;align-items:center;gap:11px;flex:1}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(145deg,#0668E1,#0a4db3);display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff}
.brand h1{font-size:15px;font-weight:700}
.brand p{font-size:10.5px;color:var(--muted);margin-top:1px}
.nav-r{display:flex;align-items:center;gap:8px}
.live{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.28);color:#4ade80;font-size:11px;font-weight:700}
.dot{width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.2s;z-index:80}
.bd.show{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;left:0;bottom:0;width:260px;background:var(--surface);border-right:1px solid var(--border);transform:translateX(-105%);transition:.25s;z-index:90;padding:16px 12px;overflow:auto}
.dr.show{transform:translateX(0)}
.dr-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.dr-h h3{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.7px}
.bb{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:var(--muted);padding:10px 12px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:500;margin-bottom:2px;transition:.12s;font-family:inherit}
.bb:hover{background:var(--card2);color:var(--text)}
.bb.on{background:rgba(6,104,225,.14);border-color:rgba(6,104,225,.4);color:var(--meta2)}
.wrap{max-width:1480px;margin:0 auto;padding:20px 22px 48px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.head h2{font-size:22px;font-weight:800;letter-spacing:-.4px}
.head .sub{font-size:12px;color:var(--muted);margin-top:4px;font-weight:500}
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:8px 11px}
.filters label{font-size:10px;color:var(--dim);font-weight:700;text-transform:uppercase}
.filters input{background:var(--card2);border:1px solid var(--border2);color:var(--text);border-radius:7px;padding:6px 9px;font-size:12px;outline:0;font-family:inherit}
.btn{border:0;background:var(--grad);color:#fff;font-weight:700;font-size:12px;padding:7px 14px;border-radius:8px;cursor:pointer;font-family:inherit}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-bottom:11px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px 14px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.kpi:before{content:"";position:absolute;left:0;top:0;right:0;height:2.5px;background:var(--c,var(--grad))}
.kpi .l{font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.kpi .v{font-size:18px;font-weight:800;letter-spacing:-.3px;line-height:1.15;color:var(--text)}
.kpi .s{font-size:10.5px;color:var(--dim);margin-top:4px;font-weight:500}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin:14px 0 18px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.panel h3{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:.4px}
.ch{height:280px;position:relative}
.tc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.th{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap}
.th h3{font-size:13px;font-weight:700}
.search{width:240px;background:var(--card2);border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:8px 11px;font-size:12.5px;outline:0;font-family:inherit}
.scroll{max-height:560px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{position:sticky;top:0;z-index:1;background:#0e1624;color:var(--muted);text-align:left;font-size:10px;letter-spacing:.4px;text-transform:uppercase;padding:11px 12px;border-bottom:2px solid var(--border2);white-space:nowrap;font-weight:700}
td{padding:11px 12px;border-bottom:1px solid #152033;color:var(--muted);white-space:nowrap;font-weight:500}
tr:hover td{background:rgba(6,104,225,.05);color:var(--text)}
.hi{color:#4ade80;font-weight:800}.mid{color:#fbbf24;font-weight:800}.lo{color:#f87171;font-weight:800}
.center{min-height:65vh;display:grid;place-items:center;color:var(--muted);text-align:center}
.sp{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--meta);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.err{max-width:480px;margin:40px auto;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);color:#fca5a5;border-radius:12px;padding:20px;line-height:1.55}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}.search{width:100%}}
</style>
</head>
<body>
<div class="bd" id="bd" onclick="closeMenu()"></div>
<aside class="dr" id="dr">
  <div class="dr-h"><h3>Brands</h3><button class="ib" style="width:30px;height:30px" onclick="closeMenu()">✕</button></div>
  <div id="brands"></div>
</aside>

<header class="nav">
  <button class="ib" onclick="openMenu()">☰</button>
  <div class="brand">
    <div class="logo">M</div>
    <div><h1>Meta Ads Manager</h1><p>Performance Dashboard</p></div>
  </div>
  <div class="nav-r">
    <div class="live"><span class="dot"></span>LIVE</div>
    <button class="ib" onclick="boot()" title="Refresh">↻</button>
    <button class="ib" id="themeBtn" onclick="toggleTheme()">☾</button>
  </div>
</header>

<div id="app"><div class="center"><div><div class="sp"></div>Loading Meta data...</div></div></div>

<script>
const CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vSiL5WkAU2ik5pbR5OdtULPGsNbO7b2wrFV4MMebkkTrS75YgTNK92UHDSX8iwsD1ExZsR7khftXnZw/pub?output=csv";
const NAME={"AVI-8 International":"AVI-8","Earnshaw International":"Thomas Earnshaw","Spinnaker International":"Spinnaker","Cadola Watches":"Cadola","Duxot Watches":"Duxot","RGMT Watches":"RGMT","Nubeo":"Nubeo"};
const dn=b=>NAME[b]||b;
const HKD_TO_USD=7.8;

let rows=[],brand="ALL",from="",to="",spendChart,roasChart;

function openMenu(){document.getElementById("dr").classList.add("show");document.getElementById("bd").classList.add("show")}
function closeMenu(){document.getElementById("dr").classList.remove("show");document.getElementById("bd").classList.remove("show")}
function toggleTheme(){const h=document.documentElement,n=h.getAttribute("data-theme")==="dark"?"light":"dark";h.setAttribute("data-theme",n);document.getElementById("themeBtn").textContent=n==="dark"?"☾":"☀";renderCharts()}

function split(line){const r=[];let c="",q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='\"'){q=!q;continue}if(ch===','&&!q){r.push(c);c="";continue}c+=ch}r.push(c);return r}
function parse(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return[];
  const h=split(lines[0]);const out=[];
  for(let i=1;i<lines.length;i++){
    const v=split(lines[i]);if(v.length<6)continue;
    const o={};h.forEach((k,idx)=>o[k]=v[idx]??"");
    if(!o.Brand||o.Brand==="Brand")continue;
    if(o["Amount spent (HKD)"]==="Amount spent (HKD)")continue;
    out.push(o);
  }
  return out;
}
function n(v){if(v==null||v===""||v==="-")return 0;const x=parseFloat(String(v).replace(/,/g,""));return isNaN(x)?0:x}
function full(v){return Math.round(Math.abs(v||0)).toLocaleString("en-US")}
function usd(v){return "US$ "+full(v/HKD_TO_USD)}
function hkd(v){return "HK$ "+full(v)}

async function boot(){
  const app=document.getElementById("app");
  app.innerHTML=`<div class="center"><div><div class="sp"></div>Loading Meta data...</div></div>`;
  try{
    const res=await fetch(CSV+"&t="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    rows=parse(await res.text());
    if(!rows.length) throw new Error("No data rows found");
    const allDates=[...new Set([
      ...rows.map(r=>r["Reporting starts"]).filter(Boolean),
      ...rows.map(r=>r["Reporting ends"]).filter(Boolean)
    ])].sort();
    from=allDates[0]; to=allDates[allDates.length-1];
    build(from,to); setBrand("ALL");
  }catch(e){
    app.innerHTML=`<div class="err"><b>Could not load data</b><br><br>${e.message}<br><br>Please try again or click Refresh.</div>`;
  }
}

function build(minDate,maxDate){
  const brands=[...new Set(rows.map(r=>r.Brand).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  document.getElementById("brands").innerHTML=
    `<button class="bb on" data-b="ALL" onclick="setBrand('ALL')">All Brands</button>`+
    brands.map(b=>`<button class="bb" data-b="${b}" onclick="setBrand('${b}')">${dn(b)}</button>`).join("");

  document.getElementById("app").innerHTML=`
  <div class="wrap">
    <div class="head">
      <div>
        <h2 id="title">All Brands</h2>
        <div class="sub" id="sub">${rows.length.toLocaleString()} ad rows · ${from} → ${to}</div>
      </div>
      <div class="filters">
        <label>From</label><input type="date" id="from" value="${from}" min="${minDate}" max="${maxDate}">
        <label>To</label><input type="date" id="to" value="${to}" min="${minDate}" max="${maxDate}">
        <button class="btn" onclick="applyDates()">Apply</button>
      </div>
    </div>
    <div class="kpis" id="kpi1"></div>
    <div class="kpis" id="kpi2"></div>
    <div class="kpis" id="kpi3"></div>
    <div class="grid2">
      <div class="panel"><h3>Spend vs Revenue by Brand (HK$)</h3><div class="ch"><canvas id="cSpend"></canvas></div></div>
      <div class="panel"><h3>ROAS by Brand</h3><div class="ch"><canvas id="cRoas"></canvas></div></div>
    </div>
    <div class="tc">
      <div class="th">
        <h3>Campaign Performance</h3>
        <input class="search" id="q" placeholder="Search campaign / brand..." oninput="drawTable()">
      </div>
      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th>Campaign</th><th>Brand</th><th>Spend</th><th>Impr.</th><th>Clicks</th>
              <th>CTR</th><th>CPC</th><th>LPV</th><th>ATC</th><th>Purchases</th>
              <th>Revenue</th><th>ROAS</th><th>CPA</th><th>Hook%</th><th>Hold%</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>`;
}

function applyDates(){from=document.getElementById("from").value;to=document.getElementById("to").value;render()}
function setBrand(b){
  brand=b;closeMenu();
  document.querySelectorAll(".bb").forEach(el=>el.classList.toggle("on",el.dataset.b===b));
  const t=document.getElementById("title"); if(t) t.textContent=b==="ALL"?"All Brands":dn(b);
  render();
}
function filtered(){
  return rows.filter(r=>{
    if(brand!=="ALL"&&r.Brand!==brand) return false;
    const s=r["Reporting starts"]||"";
    const e=r["Reporting ends"]||s;
    if(from&&s<from) return false;
    if(to&&e>to) return false;
    return true;
  });
}
function agg(list){
  const a={spend:0,imps:0,reach:0,clicks:0,lpv:0,purch:0,atc:0,rev:0,ads:0,active:0,hook:0,hold:0,hookN:0,holdN:0};
  const camps={}, brands={};
  list.forEach(r=>{
    const spend=n(r["Amount spent (HKD)"]),imps=n(r.Impressions),reach=n(r.Reach);
    const clicks=n(r["LINK CLICKS"]),lpv=n(r["Landing page views"]),purch=n(r.Purchases);
    const atc=n(r["Add to cart"]),rev=n(r["Purchase value"]),st=r["Ad delivery"]||"";
    const hook=n(r["Hook Rate (%)"]),hold=n(r["Hold Rate (%)"]);
    const cname=r["Campaign name"]||"Unknown", b=r.Brand||"Unknown";
    a.spend+=spend;a.imps+=imps;a.reach+=reach;a.clicks+=clicks;a.lpv+=lpv;a.purch+=purch;a.atc+=atc;a.rev+=rev;a.ads++;
    if(st==="ACTIVE") a.active++;
    if(hook>0){a.hook+=hook;a.hookN++} if(hold>0){a.hold+=hold;a.holdN++}
    if(!brands[b]) brands[b]={spend:0,rev:0};
    brands[b].spend+=spend; brands[b].rev+=rev;
    if(!camps[cname]) camps[cname]={brand:b,spend:0,imps:0,clicks:0,lpv:0,atc:0,purch:0,rev:0,hook:0,hold:0,hookN:0,holdN:0};
    const c=camps[cname];
    c.spend+=spend;c.imps+=imps;c.clicks+=clicks;c.lpv+=lpv;c.atc+=atc;c.purch+=purch;c.rev+=rev;
    if(hook>0){c.hook+=hook;c.hookN++} if(hold>0){c.hold+=hold;c.holdN++}
  });
  a.roas=a.spend?a.rev/a.spend:0; a.cpc=a.clicks?a.spend/a.clicks:0;
  a.ctr=a.imps?a.clicks/a.imps*100:0; a.cpa=a.purch?a.spend/a.purch:0;
  a.hookAvg=a.hookN?a.hook/a.hookN:0; a.holdAvg=a.holdN?a.hold/a.holdN:0;
  return {a,camps,brands};
}
function render(){
  const list=filtered(); const {a,camps,brands}=agg(list);
  const weekLabel = from && to ? `${from} → ${to}` : "";
  const sub=document.getElementById("sub");
  if(sub) sub.textContent=`${list.length.toLocaleString()} ad rows · ${weekLabel}`;

  document.getElementById("kpi1").innerHTML=`
    <div class="kpi" style="--c:linear-gradient(90deg,#0668E1,#4B9BFF)"><div class="l">Total Spend</div><div class="v">${usd(a.spend)}</div><div class="s">${hkd(a.spend)}</div></div>
    <div class="kpi" style="--c:linear-gradient(90deg,#16a34a,#4ade80)"><div class="l">Revenue</div><div class="v">${usd(a.rev)}</div><div class="s">${hkd(a.rev)}</div></div>
    <div class="kpi" style="--c:linear-gradient(90deg,#7c3aed,#a78bfa)"><div class="l">ROAS</div><div class="v">${a.roas.toFixed(2)}x</div><div class="s">Revenue ÷ Spend</div></div>
    <div class="kpi" style="--c:linear-gradient(90deg,#d97706,#fbbf24)"><div class="l">Purchases</div><div class="v">${full(a.purch)}</div><div class="s">Conversions</div></div>
    <div class="kpi" style="--c:linear-gradient(90deg,#0891b2,#22d3ee)"><div class="l">CPA</div><div class="v">${usd(a.cpa)}</div><div class="s">${hkd(a.cpa)}</div></div>`;

  document.getElementById("kpi2").innerHTML=`
    <div class="kpi" style="--c:linear-gradient(90deg,#0668E1,#4B9BFF)"><div class="l">Impressions</div><div class="v">${full(a.imps)}</div><div class="s">Total views</div></div>
    <div class="kpi" style="--c:linear-gradient(90deg,#0891b2,#22d3ee)"><div class="l">Reach</div><div class="v">${full(a.reach)}</div><div class="s">Unique users</div></div>
    <div class="kpi" style="--c:linear-gradient(90deg,#16a34a,#4ade80)"><div class="l">Link Clicks</div><div class="v">${full(a.clicks)}</div><div class="s">CTR ${a.ctr.toFixed(2)}%</div></div>
    <div class="kpi" style="--c:linear-gradient(90deg,#d97706,#fbbf24)"><div class="l">Add to Cart</div><div class="v">${full(a.atc)}</div><div class="s">Total ATC</div></div>
    <div class="kpi" style="--c:linear-gradient(90deg,#db2777,#f472b6)"><div class="l">Hook Rate</div><div class="v">${a.hookAvg.toFixed(1)}%</div><div class="s">Avg hook</div></div>`;

  document.getElementById("kpi3").innerHTML=`
    <div class="kpi" style="--c:linear-gradient(90deg,#7c3aed,#a78bfa)"><div class="l">Hold Rate</div><div class="v">${a.holdAvg.toFixed(1)}%</div><div class="s">Avg hold</div></div>
    <div class="kpi" style="--c:linear-gradient(90deg,#0668E1,#4B9BFF)"><div class="l">CTR</div><div class="v">${a.ctr.toFixed(2)}%</div><div class="s">Clicks ÷ Impressions</div></div>
    <div class="kpi" style="--c:linear-gradient(90deg,#16a34a,#4ade80)"><div class="l">CPC</div><div class="v">${usd(a.cpc)}</div><div class="s">${hkd(a.cpc)}</div></div>
    <div class="kpi" style="--c:linear-gradient(90deg,#d97706,#fbbf24)"><div class="l">Landing Page Views</div><div class="v">${full(a.lpv)}</div><div class="s">LPV</div></div>
    <div class="kpi" style="--c:linear-gradient(90deg,#db2777,#f472b6)"><div class="l">Active Ads</div><div class="v">${a.active}</div><div class="s">of ${a.ads} total</div></div>`;

  window.__camps=Object.entries(camps).map(([name,c])=>({
    name,brand:c.brand,spend:c.spend,imps:c.imps,clicks:c.clicks,lpv:c.lpv,atc:c.atc,purch:c.purch,rev:c.rev,
    roas:c.spend?c.rev/c.spend:0,cpc:c.clicks?c.spend/c.clicks:0,ctr:c.imps?c.clicks/c.imps*100:0,cpa:c.purch?c.spend/c.purch:0,
    hook:c.hookN?c.hook/c.hookN:0,hold:c.holdN?c.hold/c.holdN:0
  })).sort((x,y)=>y.spend-x.spend);
  window.__brands=brands; renderCharts(); drawTable();
}
function renderCharts(){
  const dark=document.documentElement.getAttribute("data-theme")==="dark";
  const tick=dark?"#94a3b8":"#64748b", grid=dark?"rgba(148,163,184,.07)":"rgba(100,116,139,.12)";
  const b=window.__brands||{};
  const names=Object.keys(b).sort((a,c)=>b[c].spend-b[a].spend);
  const labels=names.map(dn), spends=names.map(x=>b[x].spend), revs=names.map(x=>b[x].rev), roas=names.map(x=>b[x].spend?b[x].rev/b[x].spend:0);
  if(spendChart) spendChart.destroy(); if(roasChart) roasChart.destroy();
  const cs=document.getElementById("cSpend"), cr=document.getElementById("cRoas"); if(!cs||!cr) return;

  spendChart=new Chart(cs,{type:"bar",data:{labels,datasets:[
    {label:"Spend",data:spends,backgroundColor:"rgba(75,155,255,.85)",borderRadius:6,borderSkipped:false},
    {label:"Revenue",data:revs,backgroundColor:"rgba(34,197,94,.85)",borderRadius:6,borderSkipped:false}
  ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,labels:{color:tick,font:{size:11,family:"Inter"}}},tooltip:{backgroundColor:"#0c1018",titleColor:"#f1f5f9",bodyColor:"#94a3b8",borderColor:"#1e2a3a",borderWidth:1,padding:12,cornerRadius:10}},
      scales:{x:{ticks:{color:tick,font:{size:11,weight:600,family:"Inter"}},grid:{display:false},border:{display:false}},y:{ticks:{color:tick,font:{size:11,family:"Inter"},callback:v=>full(v)},grid:{color:grid},border:{display:false}}}}});

  roasChart=new Chart(cr,{type:"bar",data:{labels,datasets:[{data:roas,backgroundColor:roas.map(v=>v>=2.5?"rgba(34,197,94,.85)":v>=2?"rgba(245,158,11,.85)":"rgba(239,68,68,.75)"),borderRadius:6,borderSkipped:false}]},
    options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:"#0c1018",titleColor:"#f1f5f9",bodyColor:"#94a3b8",borderColor:"#1e2a3a",borderWidth:1,padding:12,cornerRadius:10}},
      scales:{x:{ticks:{color:tick,font:{size:11,family:"Inter"}},grid:{color:grid},border:{display:false}},y:{ticks:{color:tick,font:{size:11,weight:600,family:"Inter"}},grid:{display:false},border:{display:false}}}}});
}
function drawTable(){
  const q=(document.getElementById("q")?.value||"").toLowerCase();
  let list=window.__camps||[];
  if(q) list=list.filter(c=>c.name.toLowerCase().includes(q)||dn(c.brand).toLowerCase().includes(q));
  const tb=document.getElementById("tbody"); if(!tb) return;
  if(!list.length){tb.innerHTML=`<tr><td colspan="15" style="text-align:center;padding:40px;color:var(--dim)">No campaigns</td></tr>`;return}
  tb.innerHTML=list.slice(0,200).map(c=>{
    const cls=c.roas>=2.5?"hi":c.roas>=2?"mid":"lo";
    return `<tr>
      <td style="color:var(--text);font-weight:600;max-width:240px;overflow:hidden;text-overflow:ellipsis" title="${c.name}">${c.name}</td>
      <td style="color:var(--text);font-weight:500">${dn(c.brand)}</td>
      <td style="color:var(--text)">${hkd(c.spend)}</td>
      <td>${full(c.imps)}</td>
      <td>${full(c.clicks)}</td>
      <td>${c.ctr.toFixed(2)}%</td>
      <td>${hkd(c.cpc)}</td>
      <td>${full(c.lpv)}</td>
      <td>${full(c.atc)}</td>
      <td style="color:var(--text);font-weight:600">${c.purch}</td>
      <td style="color:var(--text)">${hkd(c.rev)}</td>
      <td class="${cls}">${c.roas.toFixed(2)}x</td>
      <td>${hkd(c.cpa)}</td>
      <td>${c.hook.toFixed(1)}%</td>
      <td>${c.hold.toFixed(1)}%</td>
    </tr>`;
  }).join("");
}
boot();
</script>
</body>
</html>
